name: Source pipeline tests

on:
  push:
    paths:
      - "tools/source_bundle.py"
      - "tests/test_source_bundle.py"
      - "requirements-source-prototype.txt"
      - ".github/workflows/source-pipeline-tests.yml"
  pull_request:
    paths:
      - "tools/source_bundle.py"
      - "tests/test_source_bundle.py"
      - "requirements-source-prototype.txt"
      - ".github/workflows/source-pipeline-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-source-prototype.txt
      - name: Run bundle and extraction tests
        run: python -m pytest tests/test_source_bundle.py -v
