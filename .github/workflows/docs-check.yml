name: Documentation checks

on:
  push:
    paths:
      - "**/*.md"
      - "LICENSE"
      - ".github/workflows/docs-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "LICENSE"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify internal markdown links resolve
        shell: bash
        run: |
          set -u
          status=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            while IFS= read -r link; do
              target=$(printf '%s' "$link" | cut -d'#' -f1)
              case "$target" in
                ""|http://*|https://*|mailto:*) continue ;;
              esac
              if [ ! -e "$dir/$target" ] && [ ! -e "$target" ]; then
                echo "BROKEN LINK: $file -> $link"
                status=1
              fi
            done < <(grep -oE '\]\([^)]+\)' "$file" | sed -E 's/^\]\(//; s/\)$//')
          done < <(git ls-files '*.md')
          exit "$status"

      - name: Basic secret-pattern guard (not a complete secret scanner)
        shell: bash
        run: |
          set -u
          # This is a limited pattern check, not a substitute for GitHub secret
          # scanning, push protection, or a dedicated secret scanner.
          if git grep -nE 'BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN CERTIFICATE-----' -- . ':(exclude).github/workflows/docs-check.yml'; then
            echo "Potential secret material detected."
            exit 1
          else
            result=$?
            # git grep returns 1 when no matches; that is the expected clean case.
            if [ "$result" -ne 1 ]; then
              echo "Secret-pattern check failed to execute."
              exit "$result"
            fi
          fi
