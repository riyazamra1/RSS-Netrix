name: Documentation checks

on:
  push:
    paths:
      - "**/*.md"
      - "LICENSE"
      - ".github/workflows/docs-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "LICENSE"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify internal markdown links resolve
        run: |
          set -u
          status=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            while IFS= read -r link; do
              target="${link%%#*}"
              case "$target" in
                ""|http://*|https://*|mailto:*) continue ;;
              esac
              if [ ! -e "$dir/$target" ] && [ ! -e "$target" ]; then
                echo "BROKEN LINK: $file -> $link"
                status=1
              fi
            done < <(grep -oE '\]\([^)]+\)' "$file" | sed -E 's/^\]\(//; s/\)$//')
          done < <(git ls-files '*.md')
          exit $status
      - name: Guard against obvious secret material
        run: |
          set -u
          status=0
          if git grep -nE 'BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN CERTIFICATE-----' -- .; then
            echo "Potential secret material detected."
            status=1
          fi
          exit $status
